<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Conversor</title>
  </head>
  <body>
    <header>
      <img src="./Assets/logo1_inspyrenet.png" alt="logo"/>
    </header>
    <main>
      <div id="div-mom">
        <h1>Conversor de Moedas</h1>
        <div class="seletor">
          <label id="margin-top1">Converter <strong>de</strong></label>
          <select>
            <option>R$ Real brasileiro</option>
          </select>
        </div>

        <div class="seletor">
          <label>Converter <strong>para</strong></label>
          <select class="toSelector">
            <option value="dolar">US$ Dólar americano</option>
            <option value="euro">€ Euro</option>
          </select>
        </div>

        <div class="seletor">
          <label>Valor</label>
          <input class="convertvalue" placeholder="R$ 10.000,00" />
        </div>

        <button class="convertbutton">Converter</button>

        <section id="div-son">
          <div>
            <img
              id="real"
              src="./Assets/brasil 2.png"
              alt="moeda a converter"
            />
            <p class="paragrafo">Real</p>
            <p class="ptoConvert">R$ 00,00</p>
          </div>

          <div>
            <img id="seta" src="./Assets/pngegg.png" alt="seta" />
          </div>

          <div>
            <img
              id="dolarimg"
              src="./Assets/estados-unidos1.png"
              alt="moeda a convertida"
            />
            <p class="convertedCurrencyName">Dolar</p>
            <p class="pConverted">$ 00,00</p>
          </div>
        </section>
      </div>
    </main>
  </body>
  <script src="script.js"></script>
</html>
